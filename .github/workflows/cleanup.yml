name: Cleanup old nightly tags

on:
  schedule:
    # Run daily at 04:00 UTC, after nightly builds have settled
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Delete old nightly SHA tags
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5
        with:
          package-name: lw-inference-proxy
          package-type: container
          # Keep the 10 most recent versions that are not pinned semver tags.
          # The filter matches short-SHA tags (7 hex chars) and the "nightly" tag
          # is excluded from deletion because it is continuously overwritten and
          # has no unique version to match here — only the accumulating SHA tags
          # need pruning.
          min-versions-to-keep: 10
          ignore-versions: '^(v\d+.*|nightly|latest)$'
