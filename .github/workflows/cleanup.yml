name: Cleanup old nightly tags

on:
  schedule:
    # Run daily at 04:00 UTC, after nightly builds have settled
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Delete old nightly SHA tags
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5
        with:
          package-name: lw-inference-proxy
          package-type: container
          # Keep the 10 most recent nightly-<sha> tagged versions.
          # Semver releases, the moving "nightly" tag, and "latest" are excluded.
          min-versions-to-keep: 10
          ignore-versions: '^(v\d+.*|nightly$|nightly-[0-9a-f]{7}.*|latest|sha256-[0-9a-f]+)$'

