name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write # required for keyless cosign signing
      security-events: write # required for GHAS SARIF upload

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - uses: golang/govulncheck-action@b625fbe08f3bccbe446d94fbf87fcc875a4f50ee # v1.0.4

      - name: Build binaries
        run: |
          LDFLAGS="-s -w -X main.version=${{ github.ref_name }}"
          GOOS=linux  GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/lw-inference-proxy-linux-amd64  ./cmd/proxy
          GOOS=linux  GOARCH=arm64 go build -ldflags="$LDFLAGS" -o dist/lw-inference-proxy-linux-arm64  ./cmd/proxy
          GOOS=darwin GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/lw-inference-proxy-darwin-amd64 ./cmd/proxy
          GOOS=darwin GOARCH=arm64 go build -ldflags="$LDFLAGS" -o dist/lw-inference-proxy-darwin-arm64 ./cmd/proxy

      - name: Checksum
        run: |
          cd dist
          sha256sum lw-inference-proxy-* > checksums.txt

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.meta.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Disabled until repo is public (GHAS requires public repo or paid license)
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        if: false
        with:
          image-ref: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: '1'

      - uses: github/codeql-action/upload-sarif@ce64ddcb0d8d890d2df4a9d1c04ff297367dea2a # v3
        if: false
        with:
          sarif_file: trivy-results.sarif

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign image
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            dist/lw-inference-proxy-linux-amd64 \
            dist/lw-inference-proxy-linux-arm64 \
            dist/lw-inference-proxy-darwin-amd64 \
            dist/lw-inference-proxy-darwin-arm64 \
            dist/checksums.txt
